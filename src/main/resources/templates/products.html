<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <title>Viha Luxe Products</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="products-section">

  <div class="container">

    <h1 class="section-title">
      Our Luxury Collection
    </h1>

    <!-- Search Bar -->

    <div class="row mb-5">

      <div class="col-md-6 mx-auto">

        <form th:action="@{/products}" method="get">

          <div class="input-group">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder="Search by name..."
                    th:value="${keyword}">

            <button
                    class="btn btn-warning"
                    type="submit">

              🔍 Search

            </button>

          </div>

        </form>

      </div>

    </div>

    <div class="row g-4">

      <div class="col-md-4"
           th:each="product : ${products}"
           th:if="${product != null and product.name != null and !#strings.isEmpty(product.name)}">

        <div class="card product-card h-100">

          <img th:src="@{'/images/' + ${product.imageUrl}}"
               class="card-img-top"
               alt="Product Image">

          <div class="card-body">

            <h4 th:text="${product.name}"></h4>

            <p th:text="${product.description}"></p>

            <h4 class="price">

              ₹ <span th:text="${product.price}"></span>

            </h4>

            <p class="stock">

              📦 Stock :

              <span th:text="${product.stock}"></span>

            </p>

            <div th:if="${product.stock > 0}">

              <a th:href="@{'/product/' + ${product.id}}"
                 class="btn btn-warning w-100">

                View Details

              </a>

            </div>

            <div th:if="${product.stock == 0}">

              <button
                      class="btn btn-secondary w-100"
                      disabled>

                Out Of Stock

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<footer class="mt-5 py-4 text-center">

  <h5>🕯️ Viha Luxe</h5>

  <p>
    Luxury Scented Candles Crafted with Elegance
  </p>

  <small>
    © 2026 Viha Luxe. All Rights Reserved.
  </small>

</footer>

</body>
</html>
