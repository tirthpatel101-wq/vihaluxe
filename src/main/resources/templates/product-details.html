<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title th:text="${product.name} + ' | Viha Luxe'">
    Product Details
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

  <div class="row align-items-center">

    <div class="col-md-6 text-center">

      <img th:src="@{/images/{img}(img=${product.imageUrl})}"
           class="img-fluid rounded shadow"
           style="max-height:500px;"
           alt="Product Image">

    </div>

    <div class="col-md-6">

      <h1 th:text="${product.name}"></h1>

      <p class="text-muted"
         th:text="${product.category}">
      </p>

      <hr>

      <p th:text="${product.description}"></p>

      <div class="product-divider"></div>

      <div class="product-info">

        <h5>Product Highlights</h5>

        <div class="product-feature">
          <span>🌸</span>
          <strong>Fragrance :</strong>&nbsp;
          <span th:text="${product.fragrance}"></span>
        </div>

        <div class="product-feature">
          <span>😊</span>
          <strong>Mood :</strong>&nbsp;
          <span th:text="${product.mood}"></span>
        </div>

        <div class="product-feature">
          <span>🎉</span>
          <strong>Occasion :</strong>&nbsp;
          <span th:text="${product.occasion}"></span>
        </div>

        <div class="product-feature">
          <span>🔥</span>
          <strong>Burn Time :</strong>&nbsp;
          <span th:text="${product.burnTime}"></span>
        </div>

        <div class="product-feature">
          <span>⭐</span>
          <strong>Intensity :</strong>&nbsp;
          <span th:text="${product.intensity}"></span>
        </div>

      </div>

      <h2 class="text-warning fw-bold">

        ₹ <span th:text="${product.price}"></span>

      </h2>

      <p>

        <strong>Stock :</strong>

        <span th:text="${product.stock}"></span>

      </p>

      <br>

      <div th:if="${product.stock > 0}">

        <form th:action="@{/cart/add/{id}(id=${product.id})}"
              method="post">

          <button type="submit"
                  class="btn btn-warning btn-lg">

            🛒 Add to Cart

          </button>

        </form>

      </div>

      <div th:if="${product.stock == 0}">

        <button class="btn btn-secondary btn-lg"
                disabled>

          Out Of Stock

        </button>

      </div>

      <br><br>

      <a th:href="@{/products}"
         class="btn btn-outline-dark">

        ← Back to Products

      </a>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<footer class="mt-5 py-4 text-center">

  <h5>🕯️ Viha Luxe</h5>

  <p>
    Luxury Scented Candles Crafted with Elegance
  </p>

  <small>
    © 2026 Viha Luxe. All Rights Reserved.
  </small>

</footer>

</body>

</html>
