<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Customize Your Candle | Viha Luxe</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/customize.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

  <div class="text-center mb-5">

    <h1 class="section-title">
      ✨ Design Your Own Luxury Candle
    </h1>

    <p class="text-muted">
      Personalize every detail and create a candle that's uniquely yours.
    </p>

  </div>

  <div class="row">

    <!-- LEFT SIDE -->

    <div class="col-lg-5">

      <div class="preview-card text-center">

        <div class="candle-preview">

          <img id="previewImage"
               src="/images/golden-amber.jpg"
               class="img-fluid">

          <div id="candleOverlay"></div>

        </div>

        <h3 id="previewName">
          Custom Luxury Candle
        </h3>

        <p id="previewDescription">

          Luxury Gold Jar<br>

          Lavender Fragrance<br>

          Soy Wax

        </p>

        <h2 class="text-warning">

          ₹ <span id="previewPrice">600</span>

        </h2>

        <hr>

        <h5>

          Your Message

        </h5>

        <p id="previewMessage"
           class="fst-italic">

          Your personalized message will appear here.

        </p>

      </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="col-lg-7">

      <form th:action="@{/customize/save}"
            method="post"
            enctype="multipart/form-data">

        <div class="checkout-card">

        <h3 class="mb-4">

          Customize Candle

        </h3>

        <!-- Size -->

        <div class="mb-3">

          <label class="form-label">

            Candle Size

          </label>

          <select id="size" name="size">

            <option value="Small (100g)">Small (100g)</option>

            <option value="Medium (200g)">Medium (200g)</option>

            <option value="Large (350g)">Large (350g)</option>

          </select>

        </div>

        <!-- Jar -->

        <div class="mb-3">

          <label class="form-label">

            Jar Type

          </label>

          <select id="jar" name="jar">

            <option value="Glass Jar">Glass Jar</option>

            <option value="Ceramic Jar">Ceramic Jar</option>

            <option value="Luxury Gold Jar">Luxury Gold Jar</option>

            <option value="Matte Black Jar">Matte Black Jar</option>

          </select>

        </div>

        <!-- Wax -->

        <div class="mb-3">

          <label class="form-label">

            Wax Type

          </label>

          <select id="wax" class="form-select" name="wax">

            <option>Soy Wax</option>

            <option>Beeswax</option>

            <option>Coconut Wax</option>

          </select>

        </div>

        <!-- Fragrance -->

        <div class="mb-3">

          <label class="form-label">

            Fragrance

          </label>

          <select id="fragrance" class="form-select" name="fragrance">

            <option>Lavender</option>

            <option>Vanilla</option>

            <option>Rose</option>

            <option>Ocean Breeze</option>

            <option>Citrus</option>

            <option>Royal Oud</option>

          </select>

        </div>

        <!-- Color -->

        <div class="mb-3">

          <label class="form-label">

            Candle Color

          </label>

          <input type="color"
                 class="form-control form-control-color"
                 name="color"
                 value="#d4af37">

        </div>

        <!-- Wick -->

        <div class="mb-3">

          <label class="form-label">

            Wick Type

          </label>

          <select id="wick" class="form-select" name="wick">

            <option>Cotton Wick</option>

            <option>Wooden Wick</option>

          </select>

        </div>

        <!-- Label -->

        <div class="mb-3">

          <label class="form-label">

            Label Style

          </label>

          <select id="label" class="form-select" name="label">

            <option>Luxury</option>

            <option>Minimal</option>

            <option>Floral</option>

          </select>

        </div>

        <!-- Message -->

        <div class="mb-3">

          <label class="form-label">

            Personalized Message

          </label>

          <textarea class="form-control"
                    rows="3"
                    id="message"
                    name="message"
                    placeholder="Write your message..."></textarea>

        </div>

        <!-- AI -->

        <div class="row">

          <div class="col-md-6">

            <button type="button"
                    id="generateMessage"
                    class="btn btn-dark w-100">

              ✨ AI Generate Message

            </button>

          </div>

          <div class="col-md-6">

            <button type="button"
                    id="recommendAI"
                    class="btn btn-warning w-100">

              🤖 AI Recommend Design

            </button>

          </div>

        </div>

          <!-- Upload Custom Image -->

          <div class="mt-4">

            <label class="form-label">
              Upload Custom Image
            </label>

            <input type="file"
                   id="customImage"
                   name="customImage"
                   class="form-control"
                   accept="image/*">

            <div id="uploadedImagePreview"
                 class="mt-3 text-center"
                 style="display:none;">

              <p class="text-warning mb-2">
                Image Preview
              </p>

              <img id="customImagePreview"
                   src=""
                   alt="Custom Image Preview"
                   class="img-fluid rounded"
                   style="max-width:220px; max-height:220px; object-fit:cover;">

            </div>

          </div>

        <!-- Gift Wrap -->

        <div class="form-check mt-4">

          <input class="form-check-input"
                 type="checkbox"
                 id="gift"
                 name="giftWrap">

          <label class="form-check-label">

            Premium Gift Wrap (+₹100)

          </label>

        </div>

        <hr>

        <h3>

          Total

          <span class="float-end text-warning">

                        ₹ <span id="totalPrice">600</span>

                    </span>

        </h3>

        <button class="btn btn-warning btn-lg w-100 mt-4">

          🛒 Add Custom Candle To Cart

        </button>

          <!-- Hidden Price -->
          <input type="hidden"
                 id="price"
                 name="price"
                 value="600">

        </div> <!-- checkout-card -->

      </form>

    </div> <!-- col-lg-7 -->

  </div> <!-- row -->

</div> <!-- container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/customize.js}"></script>

</body>

</html>
