<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<body>

<div th:fragment="navbar">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- BRAND -->
            <a class="navbar-brand fw-bold"
               th:href="@{/}">
                🕯️ Viha Luxe
            </a>

            <!-- MOBILE TOGGLER -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- NAVIGATION -->
            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/products}">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/customize}">
                            ✨ Customize Candle
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}">
                            Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cart}">
                            🛒 Cart
                        </a>
                    </li>


                    <!-- BEFORE LOGIN -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0"
                        sec:authorize="!isAuthenticated()">

                        <a class="btn btn-warning"
                           th:href="@{/login}">
                            Login
                        </a>

                    </li>


                    <!-- AFTER LOGIN -->
                    <li class="nav-item dropdown ms-lg-3 mt-2 mt-lg-0"
                        sec:authorize="isAuthenticated()">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">

                            👤
                            <span sec:authentication="name"></span>

                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/profile}">
                                    👤 My Profile
                                </a>
                            </li>

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/orders}">
                                    📦 My Orders
                                </a>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <form th:action="@{/logout}"
                                      method="post">

                                    <button type="submit"
                                            class="dropdown-item">
                                        Logout
                                    </button>

                                </form>
                            </li>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- FLOATING ASK VIHA BUTTON -->
    <a th:href="@{/ai}" class="ask-viha-floating">
        <span class="ask-viha-icon">🤖</span>
        <span class="ask-viha-text">Ask Viha</span>
    </a>

</div>

</body>
</html>
