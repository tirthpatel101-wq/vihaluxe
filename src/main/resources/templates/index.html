<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Viha Luxe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Hero Section -->
<section class="hero">

    <div class="hero-content">

        <h1>
            Luxury in Every Flame
        </h1>

        <p>

            Handcrafted premium scented candles
            designed to transform every moment
            into an unforgettable luxury experience.

        </p>

        <a href="/products"
           class="btn btn-warning">

            Explore Collection

        </a>

    </div>

    <div class="hero-scroll">

        ↓

    </div>

</section>

<!-- Featured Products -->

<section class="container py-5">

    <h2 class="section-title">
        Featured Collection
    </h2>

    <div class="row">

        <div class="col-lg-4 mb-4"
             th:each="product : ${products}">

            <div class="card">

                <img th:src="@{'/images/' + ${product.imageUrl}}"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">

                    <h4 class="card-title"
                        th:text="${product.name}">
                    </h4>

                    <p class="card-text"
                       th:text="${product.description}">
                    </p>

                    <h4 class="price">
                        ₹ <span th:text="${product.price}"></span>
                    </h4>

                    <a href="/products"
                       class="btn btn-warning w-100 mt-3">

                        View Product

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<footer class="mt-5 py-4 text-center">

    <h5>🕯️ Viha Luxe</h5>

    <p>
        Luxury Scented Candles Crafted with Elegance
    </p>

    <small>
        © 2026 Viha Luxe. All Rights Reserved.
    </small>

</footer>

</body>
</html>
