<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Checkout | Viha Luxe</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <h1 class="section-title text-center mb-5">
        Secure Checkout
    </h1>

    <form th:action="@{/place-order}" method="post">

        <div class="row">

            <!-- Shipping Details -->

            <div class="col-lg-7">

                <div class="checkout-card">

                    <h3 class="mb-4">
                        Shipping Details
                    </h3>

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter your full name"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter phone number"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Shipping Address
                        </label>

                        <textarea class="form-control"
                                  name="shippingAddress"
                                  rows="4"
                                  placeholder="Enter complete address"
                                  required></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                City
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Pincode
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>

                    </div>

                    <div class="mt-4">

                        <label class="form-label">
                            Payment Method
                        </label>

                        <select class="form-select">

                            <option>
                                Cash On Delivery
                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- Order Summary -->

            <div class="col-lg-5">

                <div class="checkout-summary">

                    <h3 class="mb-4">

                        🛒 Your Order

                    </h3>
                    <hr>
                    <div th:each="item : ${cart.items}" class="d-flex align-items-center mb-3">

                        <!-- NORMAL PRODUCT -->

                        <div th:if="${item.product != null}"
                             class="d-flex align-items-center w-100">

                            <img th:src="@{/images/{img}(img=${item.product.imageUrl})}"
                                 style="width:70px;
                                  height:70px;
                                  border-radius:15px;
                                  object-fit:cover;"
                                 alt="Product Image">

                            <div class="ms-3">

                                <strong th:text="${item.product.name}"></strong>

                                <br>

                                <small class="text-secondary">

                                    Qty :
                                    <span th:text="${item.quantity}"></span>

                                </small>

                                <br>

                                <strong class="text-warning">

                                    ₹ <span th:text="${item.product.price}"></span>

                                </strong>

                            </div>

                        </div>


                        <!-- CUSTOM CANDLE -->

                        <div th:if="${item.customCandle != null}" class="d-flex align-items-center w-100">

                            <img th:src="${item.customCandle.imagePath}"
                                 style="width:70px;
            height:70px;
            border-radius:15px;
            object-fit:cover;"
                                 alt="Custom Candle">

                            <div class="ms-3">

                                <strong>

                                    🕯️ Custom Luxury Candle

                                </strong>

                                <br>

                                <small>

                                    <span th:text="${item.customCandle.size}"></span>

                                    |

                                    <span th:text="${item.customCandle.fragrance}"></span>

                                </small>

                                <br>

                                <small>

                                    Qty :

                                    <span th:text="${item.quantity}"></span>

                                </small>

                                <br>

                                <strong class="text-warning">

                                    ₹ <span th:text="${item.customCandle.price}"></span>

                                </strong>

                            </div>

                        </div>

                    </div>

                    <hr>
                    <p>
                        Items :
                        <span class="float-end"
                              th:text="${#lists.size(cart.items)}"></span>
                    </p>

                    <p>
                        Shipping :
                        <span class="float-end text-success">
                            Free
                        </span>
                    </p>

                    <hr>

                    <h4>
                        Total

                        <span class="float-end text-warning">

                            ₹ <span th:text="${cart.totalPrice}"></span>

                        </span>

                    </h4>

                    <div class="d-grid mt-4">

                        <button type="submit"
                                class="btn btn-warning btn-lg">

                            Place Order

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<footer class="mt-5 py-4 text-center">

    <h5>🕯️ Viha Luxe</h5>

    <p>
        Luxury Scented Candles Crafted with Elegance
    </p>

    <small>
        © 2026 Viha Luxe. All Rights Reserved.
    </small>

</footer>
</body>

</html>
