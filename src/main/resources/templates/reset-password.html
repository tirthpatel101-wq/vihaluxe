<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Reset Password | Viha Luxe</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">
          🔑 Reset Password
        </h2>

        <div th:if="${error}"
             class="alert alert-danger text-center">
          ❌ <span th:text="${error}"></span>
        </div>

        <form th:if="${token != null}"
              th:action="@{/reset-password}"
              method="post">

          <input type="hidden"
                 name="token"
                 th:value="${token}">

          <div class="mb-3">

            <label class="form-label">
              New Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required
                   minlength="6">

          </div>

          <div class="mb-3">

            <label class="form-label">
              Confirm Password
            </label>

            <input type="password"
                   name="confirmPassword"
                   class="form-control"
                   required
                   minlength="6">

          </div>

          <button type="submit"
                  class="btn btn-warning w-100">

            Reset Password

          </button>

        </form>

        <p class="text-center mt-3">

          <a th:href="@{/login}">
            ← Back to Login
          </a>

        </p>

      </div>

    </div>

  </div>

</div>

</body>

</html>
