<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">
  <title>Viha Luxe AI Assistant</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="ai-page">

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-9">

      <div class="card shadow ai-chat-card">

        <div class="card-header ai-header d-flex justify-content-between align-items-center">

          <h2 class="mb-0">
            🤖 Viha Luxe AI Assistant
          </h2>

          <a th:href="@{/}"
             class="btn btn-outline-warning">

            🏠 Back to Home

          </a>

        </div>

        <div class="card-body">

          <form method="post"
                th:action="@{/ai}">

                        <textarea
                                class="form-control ai-input"
                                rows="4"
                                name="prompt"
                                placeholder="Example: I feel stressed. Which candle should I buy?"
                                required></textarea>

            <button class="btn btn-warning mt-3 w-100">

              Ask AI

            </button>

          </form>

          <div th:if="${question}" class="mt-4">

            <h5>👤 You</h5>

            <div class="user-chat"
                 th:text="${question}">
            </div>

          </div>

          <!-- AI Recommendation -->

          <div th:if="${product}" class="mt-4">

            <h4 class="mb-3">

              🤖 Viha AI

            </h4>

            <div class="card ai-product-card">

              <div class="row g-0">

                <div class="col-md-4 text-center p-3">

                  <img th:src="@{'/images/' + ${product.imageUrl}}"
                       class="img-fluid rounded"
                       style="max-height:250px">

                </div>

                <div class="col-md-8">

                  <div class="card-body">

                    <h3 th:text="${product.name}"></h3>

                    <p class="ai-chat"
                       th:text="${answer}">
                    </p>

                    <hr>

                    <p>

                      <strong>💰 Price :</strong>

                      ₹<span th:text="${product.price}"></span>

                    </p>

                    <p>

                      <strong>📂 Category :</strong>

                      <span th:text="${product.category}"></span>

                    </p>

                    <p>

                      <strong>🌸 Fragrance :</strong>

                      <span th:text="${product.fragrance}"></span>

                    </p>

                    <p>

                      <strong>😊 Mood :</strong>

                      <span th:text="${product.mood}"></span>

                    </p>

                    <p>

                      <strong>🎉 Occasion :</strong>

                      <span th:text="${product.occasion}"></span>

                    </p>

                    <p>

                      <strong>🔥 Burn Time :</strong>

                      <span th:text="${product.burnTime}"></span>

                    </p>

                    <p>

                      <strong>⭐ Intensity :</strong>

                      <span th:text="${product.intensity}"></span>

                    </p>

                    <a th:href="@{'/product/' + ${product.id}}"
                       class="btn btn-dark">

                      View Product

                    </a>

                    <form th:action="@{/cart/add/{id}(id=${product.id})}"
                          method="post"
                          style="display:inline;">

                      <button type="submit"
                              class="btn btn-warning ms-2">

                        Add to Cart

                      </button>

                    </form>

                  </div>

                </div>

              </div>

            </div>

          </div>

          <!-- Error Message -->

          <div th:if="${answer != null and product == null}"
               class="alert alert-warning mt-4"
               th:text="${answer}">
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
<footer class="mt-5 py-4 text-center">

  <h5>🕯️ Viha Luxe</h5>

  <p>
    Luxury Scented Candles Crafted with Elegance
  </p>

  <small>
    © 2026 Viha Luxe. All Rights Reserved.
  </small>

</footer>

</body>

</html>
