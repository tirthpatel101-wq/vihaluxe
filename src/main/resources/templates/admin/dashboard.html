<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard | Viha Luxe</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            👨‍💼 Viha Luxe Admin Panel

        </span>

        <a class="btn btn-outline-light"
           th:href="@{/}">

            Back To Website

        </a>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="text-center mb-5">

        Dashboard

    </h2>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card shadow text-center border-0">

                <div class="card-body">

                    <i class="bi bi-box-seam text-primary"
                       style="font-size:50px;"></i>

                    <h4 class="mt-3">

                        Products

                    </h4>

                    <h2 th:text="${totalProducts}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center border-0">

                <div class="card-body">

                    <i class="bi bi-people-fill text-success"
                       style="font-size:50px;"></i>

                    <h4 class="mt-3">

                        Users

                    </h4>

                    <h2 th:text="${totalUsers}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center border-0">

                <div class="card-body">

                    <i class="bi bi-cart-check-fill text-warning"
                       style="font-size:50px;"></i>

                    <h4 class="mt-3">

                        Orders

                    </h4>

                    <h2 th:text="${totalOrders}"></h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow text-center border-0">

                <div class="card-body">

                    <i class="bi bi-currency-rupee text-danger"
                       style="font-size:50px;"></i>

                    <h4 class="mt-3">

                        Revenue

                    </h4>

                    <h2 class="text-success">

                        ₹<span th:text="${#numbers.formatDecimal(totalRevenue,1,2)}"></span>

                    </h2>

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-5">

        <div class="col-md-4">

            <a th:href="@{/admin/products}"
               class="btn btn-primary w-100 p-3">

                📦 Manage Products

            </a>

        </div>

        <div class="col-md-4">

            <a th:href="@{/admin/orders}"
               class="btn btn-success w-100 p-3">

                📋 Manage Orders

            </a>

        </div>

        <div class="col-md-4">

            <a th:href="@{/admin/users}"
               class="btn btn-warning w-100 p-3">

                👥 Manage Users

            </a>

        </div>

    </div>

    <!-- Recent Orders -->

    <div class="card shadow mt-5">

        <div class="card-header bg-dark text-white">

            <h4 class="mb-0">

                Recent Orders

            </h4>

        </div>

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-light">

                <tr>

                    <th>Order ID</th>

                    <th>Customer</th>

                    <th>Total</th>

                    <th>Status</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="order : ${recentOrders}">

                    <td th:text="${order.id}"></td>

                    <td th:text="${order.user.fullName}"></td>

                    <td>

                        ₹ <span th:text="${order.totalAmount}"></span>

                    </td>

                    <td>

                        <span class="badge bg-success"
                              th:text="${order.status}">
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<footer class="mt-5 py-4 text-center">

    <h5>🕯️ Viha Luxe</h5>

    <p>
        Luxury Scented Candles Crafted with Elegance
    </p>

    <small>
        © 2026 Viha Luxe. All Rights Reserved.
    </small>

</footer>
</body>

</html>
