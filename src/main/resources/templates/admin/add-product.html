<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>Add Product</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

  <div class="container">

        <span class="navbar-brand">

            ➕ Add Product

        </span>

    <a th:href="@{/admin/products}"
       class="btn btn-warning">

      Back

    </a>

  </div>

</nav>

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-body">

      <form th:action="@{/admin/products/save}"
            th:object="${product}"
            method="post">

        <div class="mb-3">

          <label>Name</label>

          <input type="text"
                 th:field="*{name}"
                 class="form-control"
                 required>

        </div>

        <div class="mb-3">

          <label>Description</label>

          <textarea th:field="*{description}"
                    class="form-control"
                    rows="3"></textarea>

        </div>

        <div class="row">

          <div class="col-md-6">

            <label>Price</label>

            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   class="form-control"
                   required>

          </div>

          <div class="col-md-6">

            <label>Stock</label>

            <input type="number"
                   th:field="*{stock}"
                   class="form-control"
                   required>

          </div>

        </div>

        <div class="mt-3">

          <label>Category</label>

          <input type="text"
                 th:field="*{category}"
                 class="form-control">

        </div>

        <div class="mt-3">

          <label>Image File Name</label>

          <input type="text"
                 th:field="*{imageUrl}"
                 class="form-control"
                 placeholder="example: vanilla.jpg">

        </div>

        <div class="mt-4">

          <button type="submit"
                  class="btn btn-success">

            Save Product

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
<footer class="mt-5 py-4 text-center">

  <h5>🕯️ Viha Luxe</h5>

  <p>
    Luxury Scented Candles Crafted with Elegance
  </p>

  <small>
    © 2026 Viha Luxe. All Rights Reserved.
  </small>

</footer>
</body>

</html>
