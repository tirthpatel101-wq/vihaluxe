<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Manage Products</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">

            📦 Product Management

        </span>

        <a th:href="@{/admin}" class="btn btn-warning">

            Dashboard

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>All Products</h2>

        <a th:href="@{/admin/products/add}"

           class="btn btn-success">

            + Add Product

        </a>

    </div>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Image</th>

            <th>Name</th>

            <th>Category</th>

            <th>Price</th>

            <th>Stock</th>

            <th width="180">Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.id}"></td>

            <td>

                <img th:src="@{/images/{img}(img=${product.imageUrl})}"

                     width="70"

                     height="70"

                     style="object-fit:cover;">

            </td>

            <td th:text="${product.name}"></td>

            <td th:text="${product.category}"></td>

            <td>

                ₹ <span th:text="${product.price}"></span>

            </td>

            <td th:text="${product.stock}"></td>

            <td>

                <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"

                   class="btn btn-primary btn-sm">

                    Edit

                </a>

                <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"

                   class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>
<footer class="mt-5 py-4 text-center">

    <h5>🕯️ Viha Luxe</h5>

    <p>
        Luxury Scented Candles Crafted with Elegance
    </p>

    <small>
        © 2026 Viha Luxe. All Rights Reserved.
    </small>

</footer>
</body>

</html>
